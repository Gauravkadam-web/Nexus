name: nexus_frontend
description: "Nexus — AI-Powered Case Management Platform Frontend (Web, Mobile, Desktop)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & HTTP
  dio: ^5.4.1

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^13.2.0

  # Typography & Icons
  google_fonts: ^6.1.0
  material_symbols_icons: ^4.2960.0

  # Local Storage for JWT Tokens
  shared_preferences: ^2.2.2

  # Date formatting & Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
