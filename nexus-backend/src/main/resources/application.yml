spring:
  application:
    name: nexus-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SUPABASE_DB_URL:${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/nexus_dev}}}
    username: ${SUPABASE_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}}
    password: ${SUPABASE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      # Disable Spring AI auto-config failure when key is absent (mock mode)
      chat:
        options:
          model: gpt-4o-mini

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

nexus:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-that-is-at-least-32-bytes-long-change-in-prod}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app}
  ai:
    provider: ${AI_PROVIDER:mock}
  email:
    provider: ${EMAIL_PROVIDER:brevo}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-dir: ${STORAGE_LOCAL_DIR:uploads}
    supabase:
      url: ${SUPABASE_URL:${SUPABASE_STORAGE_URL:}}
      key: ${SUPABASE_SERVICE_ROLE_KEY:${SUPABASE_STORAGE_KEY:}}
      bucket: ${SUPABASE_STORAGE_BUCKET:nexus-attachments}


