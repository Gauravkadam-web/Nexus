spring:
  application:
    name: nexus-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      # Disable Spring AI auto-config failure when key is absent (mock mode)
      chat:
        options:
          model: gpt-4o-mini

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

nexus:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-that-is-at-least-32-bytes-long-change-in-prod}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app}
  ai:
    provider: ${AI_PROVIDER:mock}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-dir: ${STORAGE_LOCAL_DIR:uploads}
    supabase:
      url: ${SUPABASE_URL:}
      key: ${SUPABASE_SERVICE_ROLE_KEY:}
      bucket: ${SUPABASE_STORAGE_BUCKET:nexus-attachments}


