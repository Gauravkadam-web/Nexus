# ==============================================================================
# Nexus — Render Infrastructure Blueprint (render.yaml)
# Auto-configures Spring Boot 3.3.4 Docker service on Render
# ==============================================================================

services:
  - type: web
    name: nexus-backend
    runtime: docker
    dockerfilePath: ./nexus-backend/Dockerfile
    dockerContext: ./nexus-backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USERNAME
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:*,http://127.0.0.1:*"
      - key: AI_PROVIDER
        value: mock
      - key: EMAIL_PROVIDER
        value: brevo
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: nexus-attachments
